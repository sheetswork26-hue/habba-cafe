    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- صورة الهيرو هي الـ LCP، فبنحمّلها بدري. لازم تفضل مطابقة للـ srcset في Hero.tsx -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=640&q=65 640w, https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1024&q=65 1024w, https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1600&q=65 1600w, https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=2200&q=65 2200w"
      imagesizes="100vw"
    />

    <!-- بيطبّق الوضع الليلي قبل أول رسم للصفحة عشان مايحصلش وميض -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('habba-theme')
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#15100D')
          }
        } catch (e) {}
      })()
    </script>

  <body>
    <div id="root"></div>
    <noscript>الصفحة دي محتاجة JavaScript عشان تشتغل.</noscript>
